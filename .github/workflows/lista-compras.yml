name: Gerar lista de compras

on:
  schedule:
    - cron: '0 9 * * *' # 1x/dia, 09:00 UTC (~06:00 BRT) - antes do horario comercial
  workflow_dispatch: {}

permissions:
  contents: write

# Compartilha o mesmo grupo dos outros dois: os tres giram o BLING_REFRESH_TOKEN
# (esse aqui nao mexe no ML_REFRESH_TOKEN, mas ainda assim nao pode rodar ao
# mesmo tempo que o verificador de estoque sem risco de corrida no token do
# Bling). E uma consulta pesada (milhares de pedidos, ~3300 em ~40min com
# e-commerce ML+Bagy) — 45min de timeout já quase estourou uma vez, dando
# folga maior aqui pra não voltar a acontecer conforme o volume cresce.
concurrency:
  group: ml-bling-token
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      # lista-compras.json vai pro Supabase agora — nao ha mais nada pra
      # commitar nesse workflow (custo/investimento e dado de negocio).
      - run: npm run lista-compras
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          BLING_DEPOSITO_ID: ${{ secrets.BLING_DEPOSITO_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
