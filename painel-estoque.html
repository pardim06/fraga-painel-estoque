<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estoque — Fraga Bike Shop</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<div class="container">
  <div class="header rise">
    <div class="header-left">
      <a href="index.html" class="badge"><img src="assets/logo-fraga.png" alt="Fraga Bike Shop"></a>
      <div>
        <h1>Painel de Estoque</h1>
        <div class="subtitle">Fraga Bike Shop · Bling × Mercado Livre</div>
      </div>
    </div>
    <div class="badge-live"><span class="dot"></span> Confere a cada 5min</div>
  </div>

  <nav class="module-nav rise" style="animation-delay:.04s">
    <a href="dashboard.html">Dashboard</a>
    <a href="painel-estoque.html" class="active">Painel de Estoque</a>
    <a href="perguntas-ml.html">Perguntas ML</a>
    <a href="lista-compras.html">Lista de Compras</a>
    <a href="reputacao-ml.html">Reputação ML</a>
    <a href="saude-anuncios.html">Saúde dos Anúncios</a>
  </nav>

  <div id="conteudo"></div>

  <footer>Painel interno · dados do último resultado gerado pelo verificador automático</footer>
</div>

<script>
  const GAUGE_R = 50;
  const GAUGE_C = 2 * Math.PI * GAUGE_R;

  async function buscarJson(url) {
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) return null;
      return await resp.json();
    } catch {
      return null;
    }
  }

  async function carregar() {
    renderCarregando();

    const [dados, historico] = await Promise.all([
      buscarJson('resultado-verificacao.json'),
      buscarJson('historico-correcoes.json'),
    ]);

    if (!dados) {
      renderErro('Não foi possível carregar o resultado-verificacao.json. Ele só existe depois da primeira execução do workflow no GitHub Actions.');
      return;
    }

    renderPainel(dados, historico || []);
  }

  function renderCarregando() {
    document.getElementById('conteudo').innerHTML = '<div class="loading-state">Carregando…</div>';
  }

  function renderErro(msg, detalhe) {
    document.getElementById('conteudo').innerHTML =
      '<div class="error-state">' + escapeHtml(msg) + (detalhe ? '<span class="detail">' + escapeHtml(detalhe) + '</span>' : '') + '</div>';
  }

  function escapeHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  function formatarData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  // Positivo: Bling tem mais que o ML. Negativo: Bling tem menos que o ML
  // publicado (risco de vender sem estoque).
  function formatarDiferenca(n) {
    return (n > 0 ? '+' : '') + n;
  }

  // Só o sentido de risco (Bling < ML) passa por correção automática.
  function statusBadge(d) {
    if (d.diferenca >= 0) {
      return '<span class="status-badge neutral">sem ação</span>';
    }
    if (d.corrigido) {
      return '<span class="status-badge ok" title="' + escapeHtml(d.corrigidoDetalhe || '') + '">Corrigido</span>';
    }
    return '<span class="status-badge alert" title="' + escapeHtml(d.corrigidoDetalhe || '') + '">Falha ao corrigir</span>';
  }

  function statusTexto(d) {
    if (d.diferenca >= 0) return 'Sem acao';
    return d.corrigido ? 'Corrigido' : 'Falha ao corrigir';
  }

  function gaugeSvg(pct) {
    const cor = pct >= 98 ? 'var(--ok)' : pct >= 90 ? 'var(--blue)' : 'var(--alert)';
    return `
      <svg viewBox="0 0 120 120" role="img" aria-label="${pct}% dos SKUs em dia">
        <circle cx="60" cy="60" r="${GAUGE_R}" fill="none" stroke="var(--line)" stroke-width="9"/>
        <circle class="gauge-progress" cx="60" cy="60" r="${GAUGE_R}" fill="none" stroke="${cor}"
          stroke-width="9" stroke-linecap="round" stroke-dasharray="${GAUGE_C}"
          stroke-dashoffset="${GAUGE_C}" transform="rotate(-90 60 60)"/>
      </svg>`;
  }

  function renderPainel(dados, historico) {
    const { atualizadoEm, totalSkus, corretos, totalDivergentes, divergencias } = dados;
    const total = totalSkus ?? 0;
    const ok = corretos ?? 0;
    const pct = total > 0 ? Math.round((ok / total) * 100) : 0;
    const divs = divergencias || [];

    window._divergenciasAtuais = divs;

    let html = '';

    html += '<div class="hero rise">';
    html += '  <div class="gauge-wrap">' + gaugeSvg(pct) +
            '    <div class="gauge-readout"><div class="pct">' + pct + '<span class="unit">%</span></div><div class="lbl">Em dia</div></div>' +
            '  </div>';
    html += '  <div class="specs">';
    html += '    <div class="spec-row"><span class="k">Total de SKUs verificados</span><span class="v">' + (totalSkus ?? '—') + '</span></div>';
    html += '    <div class="spec-row spec-ok"><span class="k">Corretos</span><span class="v">' + (corretos ?? '—') + '</span></div>';
    html += '    <div class="spec-row spec-alert"><span class="k">Divergentes</span><span class="v">' + (totalDivergentes ?? 0) + '</span></div>';
    html += '    <div class="updated-at">Última verificação: ' + formatarData(atualizadoEm) + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="section-header rise" style="animation-delay:.08s">';
    html += '  <div class="section-title">Divergências <span class="count-chip">' + divs.length + '</span></div>';
    if (divs.length > 0) {
      html += '  <div class="export-buttons">';
      html += '    <button class="btn-export primary" onclick="exportarCSV()">Baixar CSV</button>';
      html += '    <button class="btn-export secondary" onclick="copiarLista()">Copiar lista</button>';
      html += '  </div>';
    }
    html += '</div>';

    if (divs.length > 0) {
      html += '<div class="table-scroll rise" style="animation-delay:.14s"><table><thead><tr>' +
        '<th>SKU</th><th>Produto</th><th class="num">Bling</th><th class="num">ML</th><th class="num">Diferença</th><th>Status</th>' +
        '</tr></thead><tbody>';
      divs
        .slice()
        .sort((a, b) => Math.abs(b.diferenca) - Math.abs(a.diferenca))
        .forEach((d) => {
          html += '<tr>' +
            '<td class="sku">' + escapeHtml(d.sku) + '</td>' +
            '<td class="produto" title="' + escapeHtml(d.nome) + '">' + escapeHtml(d.nome || '—') + '</td>' +
            '<td class="num">' + d.qtdBling + '</td>' +
            '<td class="num">' + d.qtdML + '</td>' +
            '<td class="num"><span class="diff-badge">' + formatarDiferenca(d.diferenca) + '</span></td>' +
            '<td>' + statusBadge(d) + '</td>' +
            '</tr>';
        });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty-state rise" style="animation-delay:.14s">' +
        '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M6 10.5l2.5 2.5L14 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        'Estoque em dia — nenhuma divergência encontrada</div>';
    }

    if (historico && historico.length > 0) {
      html += '<div class="section-header rise" style="animation-delay:.24s; margin-top:24px;">';
      html += '  <div class="section-title">Histórico de correções automáticas <span class="count-chip">' + historico.length + '</span>' +
        '<span style="font-size:11.5px;font-weight:400;color:var(--ink-faint);">últimos 3 dias</span></div>';
      html += '</div>';
      html += '<div class="table-scroll rise" style="animation-delay:.26s"><table><thead><tr>' +
        '<th>SKU</th><th>Produto</th><th class="num">De</th><th class="num">Para</th><th>Quando</th>' +
        '</tr></thead><tbody>';
      historico.forEach((h) => {
        html += '<tr>' +
          '<td class="sku">' + escapeHtml(h.sku) + '</td>' +
          '<td class="produto" title="' + escapeHtml(h.nome) + '">' + escapeHtml(h.nome || '—') + '</td>' +
          '<td class="num">' + h.qtdAnteriorML + '</td>' +
          '<td class="num">' + h.qtdNova + '</td>' +
          '<td>' + formatarData(h.dataHora) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('conteudo').innerHTML = html;

    // dispara a animação do medidor depois que o SVG já está no DOM
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const prog = document.querySelector('.gauge-progress');
        if (prog) prog.style.strokeDashoffset = GAUGE_C * (1 - pct / 100);
      });
    });
  }

  function exportarCSV() {
    const lista = window._divergenciasAtuais || [];
    if (lista.length === 0) return;

    let csv = 'SKU;Produto;Estoque Bling;Estoque ML;Diferenca;Status\n';
    lista
      .slice()
      .sort((a, b) => Math.abs(b.diferenca) - Math.abs(a.diferenca))
      .forEach((d) => {
        csv += d.sku + ';' + (d.nome || '').replace(/;/g, ',') + ';' + d.qtdBling + ';' + d.qtdML + ';' + formatarDiferenca(d.diferenca) + ';' + statusTexto(d) + '\n';
      });

    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const hoje = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'produtos-para-arrumar-' + hoje + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function copiarLista() {
    const lista = window._divergenciasAtuais || [];
    if (lista.length === 0) return;

    let texto = 'Produtos para arrumar (' + lista.length + '):\n\n';
    lista
      .slice()
      .sort((a, b) => Math.abs(b.diferenca) - Math.abs(a.diferenca))
      .forEach((d) => {
        texto += 'SKU ' + d.sku + ' (' + (d.nome || 'sem nome') + '): Bling ' + d.qtdBling + ' | ML ' + d.qtdML + ' | diferenca ' + formatarDiferenca(d.diferenca) + ' | ' + statusTexto(d) + '\n';
      });

    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.querySelector('.btn-export.secondary');
      if (btn) {
        const original = btn.textContent;
        btn.textContent = 'Copiado!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      }
    }).catch(() => {
      alert('Não foi possível copiar automaticamente. Copie manualmente a lista da tabela.');
    });
  }

  carregar();
</script>
</body>
</html>
