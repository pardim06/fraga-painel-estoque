name: Saúde dos anúncios ML

on:
  # Encadeado no workflow de lista de compras (já roda 1x/dia de forma
  # confiável) — saúde de anúncio não muda de hora em hora, não precisa de
  # cron próprio.
  workflow_run:
    workflows: ['Gerar lista de compras']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ml-bling-token
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run saude-anuncios
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ZAPI_INSTANCE_URL: ${{ secrets.ZAPI_INSTANCE_URL }}
          WHATSAPP_DESTINO: ${{ secrets.WHATSAPP_DESTINO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}

      - run: npm run mercadolider
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}

      # Corrige o sentido de risco (Bling < Bagy) automaticamente, igual ao
      # ML. Roda 1x/dia junto dos outros (estoque Bagy não muda tão rápido
      # quanto o do ML). Ver verificador-estoque-bagy-bling.js.
      - run: npm run verificar-bagy
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          BLING_DEPOSITO_ID: ${{ secrets.BLING_DEPOSITO_ID }}
          BAGY_ACCESS_TOKEN: ${{ secrets.BAGY_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ZAPI_INSTANCE_URL: ${{ secrets.ZAPI_INSTANCE_URL }}
          WHATSAPP_DESTINO: ${{ secrets.WHATSAPP_DESTINO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}

      - name: Commitar resultado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saude-anuncios.json saude-anuncios-estado.json mercadolider-platinum.json resultado-bagy.json
          git diff --quiet --cached || git commit -m "chore: atualiza saude dos anuncios, mercadolider e estoque bagy"
          git pull --rebase
          git push
