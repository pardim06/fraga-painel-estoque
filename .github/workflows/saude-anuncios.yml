name: Saúde dos anúncios ML

on:
  # Encadeado no workflow de lista de compras (já roda 1x/dia de forma
  # confiável) — saúde de anúncio não muda de hora em hora, não precisa de
  # cron próprio.
  workflow_run:
    workflows: ['Gerar lista de compras']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ml-bling-token
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run saude-anuncios
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ZAPI_INSTANCE_URL: ${{ secrets.ZAPI_INSTANCE_URL }}
          WHATSAPP_DESTINO: ${{ secrets.WHATSAPP_DESTINO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: npm run mercadolider
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # saude-anuncios.json e mercadolider-platinum.json vao pro Supabase —
      # so saude-anuncios-estado.json (controle interno de alerta) continua
      # sendo commitado.
      - name: Commitar resultado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saude-anuncios-estado.json
          git diff --quiet --cached || git commit -m "chore: atualiza estado interno de saude dos anuncios"
          git pull --rebase
          git push
